<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minispiel: Web-Dev Quiz</title>
<style>
body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}
.quiz-container {
    background: #ffffff;
    padding: 2.5rem;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    width: 90%;
    max-width: 500px;
}
.header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 2rem;
    color: #555;
    font-weight: bold;
}
.question {
    font-size: 1.4rem;
    color: #333;
    margin-bottom: 1.5rem;
    min-height: 60px;
}
.options {
    display: flex;
    flex-direction: column;
    gap: 1rem;
}
.option-btn {
    padding: 1rem;
    background: #f8f9fa;
    border: 2px solid #e9ecef;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    text-align: left;
    transition: all 0.2s;
}
.option-btn:hover:not(:disabled) {
    background: #e9ecef;
    border-color: #ced4da;
}
.option-btn.correct {
    background: #d4edda;
    border-color: #28a745;
    color: #155724;
}
.option-btn.wrong {
    background: #f8d7da;
    border-color: #dc3545;
    color: #721c24;
}
.option-btn:disabled {
    cursor: not-allowed;
}
#nextBtn {
    margin-top: 2rem;
    width: 100%;
    padding: 1rem;
    background: #667eea;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    display: none;
    transition: background 0.3s;
}
#nextBtn:hover {
    background: #5a6fd6;
}
.score-screen {
    text-align: center;
    display: none;
}
.score-screen h2 {
    color: #764ba2;
    font-size: 2rem;
}
#restartBtn {
    margin-top: 1.5rem;
    padding: 1rem 2rem;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}
</style>
</head>
<body>
<div class="quiz-container" id="quizBox">
<div class="header">
<span id="questionCount">Frage 1/3</span>
<span id="scoreDisplay">Punkte: 0</span>
</div>
<div class="question" id="questionText"></div>
<div class="options" id="optionsContainer"></div>
<button id="nextBtn">Nächste Frage</button>
</div>
<div class="quiz-container score-screen" id="scoreBox">
<h2>Quiz beendet!</h2>
<p id="finalScore"></p>
<button id="restartBtn">Neu starten</button>
</div>
<script>
const quizData = [
{ q: "Wofür steht CSS?", options: ["Cascading Style Sheets", "Computer Style Symbols", "Creative Style System"], a: 0 },
{ q: "Welches HTML-Tag bindet JavaScript ein?", options: ["<js>", "<script>", "<javascript>"], a: 1 },
{ q: "Was bewirkt 'display: flex;'?", options: ["Blendet Elemente aus", "Aktiviert das Flexbox-Layout", "Färbt den Hintergrund"], a: 1 }
];
let currentQ = 0;
let score = 0;
const qText = document.getElementById('questionText');
const optContainer = document.getElementById('optionsContainer');
const nextBtn = document.getElementById('nextBtn');
const qCount = document.getElementById('questionCount');
const sDisplay = document.getElementById('scoreDisplay');
const quizBox = document.getElementById('quizBox');
const scoreBox = document.getElementById('scoreBox');
const finalScore = document.getElementById('finalScore');
const restartBtn = document.getElementById('restartBtn');
function loadQuiz() {
optContainer.innerHTML = '';
nextBtn.style.display = 'none';
const q = quizData[currentQ];
qText.textContent = q.q;
qCount.textContent = `Frage ${currentQ + 1}/${quizData.length}`;
sDisplay.textContent = `Punkte: ${score}`;
q.options.forEach((opt, index) => {
const btn = document.createElement('button');
btn.className = 'option-btn';
btn.textContent = opt;
btn.onclick = () => checkAnswer(btn, index, q.a);
optContainer.appendChild(btn);
});
}
function checkAnswer(btn, selected, correct) {
const buttons = document.querySelectorAll('.option-btn');
buttons.forEach(b => b.disabled = true);
if (selected === correct) {
btn.classList.add('correct');
score++;
sDisplay.textContent = `Punkte: ${score}`;
} else {
btn.classList.add('wrong');
buttons[correct].classList.add('correct');
}
nextBtn.style.display = 'block';
if (currentQ === quizData.length - 1) {
nextBtn.textContent = 'Ergebnis anzeigen';
}
}
nextBtn.onclick = () => {
currentQ++;
if (currentQ < quizData.length) {
loadQuiz();
} else {
quizBox.style.display = 'none';
scoreBox.style.display = 'block';
finalScore.textContent = `Du hast ${score} von ${quizData.length} Fragen richtig beantwortet.`;
}
};
restartBtn.onclick = () => {
currentQ = 0;
score = 0;
quizBox.style.display = 'block';
scoreBox.style.display = 'none';
nextBtn.textContent = 'Nächste Frage';
loadQuiz();
};
loadQuiz();
</script>
</body>
</html>
