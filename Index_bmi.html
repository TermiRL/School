<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamischer BMI-Rechner</title>
<style>
body {
    font-family: 'Arial', sans-serif;
    background: #e0e5ec;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.calculator {
    background: #e0e5ec;
    padding: 3rem;
    border-radius: 20px;
    box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
    width: 100%;
    max-width: 400px;
    text-align: center;
}
h2 {
    color: #4d4d4d;
    margin-top: 0;
}
.input-group {
    margin-bottom: 1.5rem;
    text-align: left;
}
label {
    display: block;
    margin-bottom: 0.5rem;
    color: #666;
    font-weight: bold;
}
input[type="number"] {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #e0e5ec;
    box-shadow: inset 6px 6px 10px 0 rgba(163,177,198, 0.5), inset -6px -6px 10px 0 rgba(255,255,255, 0.8);
    box-sizing: border-box;
    font-size: 1rem;
    color: #333;
    outline: none;
}
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #4a90e2;
    color: white;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 4px 4px 10px rgba(0,0,0,0.1);
    transition: transform 0.1s, box-shadow 0.1s;
    margin-top: 1rem;
}
button:active {
    transform: scale(0.98);
    box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
}
#resultBox {
    margin-top: 2rem;
    padding: 1.5rem;
    border-radius: 10px;
    display: none;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#bmiValue {
    font-size: 2.5rem;
    font-weight: bold;
    margin: 0;
}
#bmiCategory {
    font-size: 1.1rem;
    margin-top: 0.5rem;
}
@keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
}
</style>
</head>
<body>
<div class="calculator">
<h2>BMI Rechner</h2>
<div class="input-group">
<label for="height">Körpergröße (in cm)</label>
<input type="number" id="height" placeholder="z.B. 175" required>
</div>
<div class="input-group">
<label for="weight">Gewicht (in kg)</label>
<input type="number" id="weight" placeholder="z.B. 68" required>
</div>
<button id="calcBtn">BMI berechnen</button>
<div id="resultBox">
<p id="bmiValue"></p>
<p id="bmiCategory"></p>
</div>
</div>
<script>
const heightInput = document.getElementById('height');
const weightInput = document.getElementById('weight');
const calcBtn = document.getElementById('calcBtn');
const resultBox = document.getElementById('resultBox');
const bmiValue = document.getElementById('bmiValue');
const bmiCategory = document.getElementById('bmiCategory');
calcBtn.addEventListener('click', () => {
const height = parseFloat(heightInput.value) / 100;
const weight = parseFloat(weightInput.value);
if (!height || !weight || height <= 0 || weight <= 0) {
alert("Bitte gültige Werte eingeben!");
return;
}
const bmi = (weight / (height * height)).toFixed(1);
bmiValue.textContent = bmi;
resultBox.style.display = 'block';
resultBox.style.color = '#fff';
if (bmi < 18.5) {
bmiCategory.textContent = "Untergewicht";
resultBox.style.background = "#3498db"; 
} else if (bmi >= 18.5 && bmi <= 24.9) {
bmiCategory.textContent = "Normalgewicht";
resultBox.style.background = "#2ecc71"; 
} else if (bmi >= 25 && bmi <= 29.9) {
bmiCategory.textContent = "Übergewicht";
resultBox.style.background = "#f1c40f"; 
} else {
bmiCategory.textContent = "Adipositas";
resultBox.style.background = "#e74c3c"; 
}
});
</script>
</body>
</html>
