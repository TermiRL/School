<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaktive Infoseite: Sonnensystem</title>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    background: #0b0b1a;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
}
header {
    margin: 3rem 0;
    text-align: center;
}
h1 {
    color: #4da6ff;
    font-size: 2.5rem;
    margin: 0;
    letter-spacing: 2px;
}
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 2rem;
    width: 90%;
    max-width: 1000px;
}
.card {
    background: #1a1a3a;
    padding: 2rem;
    border-radius: 12px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    border: 1px solid #2a2a5a;
}
.card:hover {
    transform: translateY(-10px);
    box-shadow: 0 10px 20px rgba(77, 166, 255, 0.3);
    border-color: #4da6ff;
}
.card h2 {
    margin: 0;
    font-size: 1.5rem;
}
#modal {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
}
#modal.active {
    opacity: 1;
    pointer-events: all;
}
.modal-content {
    background: #1a1a3a;
    padding: 3rem;
    border-radius: 12px;
    max-width: 500px;
    width: 80%;
    text-align: center;
    transform: scale(0.8);
    transition: transform 0.4s ease;
    border: 2px solid #4da6ff;
}
#modal.active .modal-content {
    transform: scale(1);
}
.modal-content h2 {
    color: #4da6ff;
    margin-top: 0;
}
button {
    margin-top: 2rem;
    padding: 0.8rem 1.5rem;
    background: #4da6ff;
    color: #0b0b1a;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
}
button:hover {
    background: #80c1ff;
}
</style>
</head>
<body>
<header>
<h1>Galaktische Entdeckungen</h1>
<p>Klicke auf einen Planeten, um mehr zu erfahren.</p>
</header>
<div class="grid" id="planetGrid">
<div class="card" data-title="Mars" data-desc="Der Rote Planet. Er ist staubig, kalt und hat eine sehr dünne Atmosphäre.">
<h2>Mars</h2>
</div>
<div class="card" data-title="Jupiter" data-desc="Der größte Planet in unserem Sonnensystem. Er ist ein riesiger Gasball.">
<h2>Jupiter</h2>
</div>
<div class="card" data-title="Saturn" data-desc="Bekannt für seine beeindruckenden Ringe aus Eis und Gestein.">
<h2>Saturn</h2>
</div>
<div class="card" data-title="Neptun" data-desc="Der äußerste Planet, bekannt für seine tiefblaue Farbe und starke Winde.">
<h2>Neptun</h2>
</div>
</div>
<div id="modal">
<div class="modal-content">
<h2 id="modalTitle"></h2>
<p id="modalDesc"></p>
<button id="closeBtn">Schließen</button>
</div>
</div>
<script>
const cards = document.querySelectorAll('.card');
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalDesc = document.getElementById('modalDesc');
const closeBtn = document.getElementById('closeBtn');
cards.forEach(card => {
card.addEventListener('click', () => {
modalTitle.textContent = card.dataset.title;
modalDesc.textContent = card.dataset.desc;
modal.classList.add('active');
});
});
closeBtn.addEventListener('click', () => {
modal.classList.remove('active');
});
modal.addEventListener('click', (e) => {
if (e.target === modal) {
modal.classList.remove('active');
}
});
</script>
</body>
</html>
